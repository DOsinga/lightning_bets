[package]
name = "lightning_bets"
version = "0.1.0"
edition = "2021"

[dependencies]
# receive_for_hash_with_min_final_cltv_expiry_delta landed after v0.7.0, so pin main.
ldk-node = { git = "https://github.com/lightningdevkit/ldk-node", rev = "79e4d92ae73c753dd64ee68ed8cb599cda8af8c7", default-features = false, features = ["chain-bitcoind", "chain-esplora", "storage-sqlite"] }
corepc-node = { version = "0.10.1", default-features = false, features = ["29_0"] }
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
